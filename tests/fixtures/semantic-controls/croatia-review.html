<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 16px sans-serif; margin: 24px; }
    main { max-width: 760px; }
    .steps { display: flex; gap: 20px; margin-bottom: 20px; }
    .current { font-weight: 700; }
    label, button, input { margin-top: 14px; }
    button { display: block; padding: 10px 18px; }
  </style>
</head>
<body>
  <main>
    <nav class="steps" aria-label="Checkout progress">
      <span>BOOK COMPLETED STEP</span>
      <span class="current">PAY <span class="sr-only">CURRENT STEP</span></span>
    </nav>
    <h1>Your booking</h1>
    <p>Zagreb (ZAG) to Sarajevo (SJJ)</p>
    <p>Total to be paid <strong>EUR 141.62</strong></p>

    <label for="promo">Promotion code — Do you have a promotion code?</label>
    <input id="promo" name="promotion_code" type="text" required>

    <label>
      <input id="terms" type="checkbox" required>
      I agree with the <a href="#carriage">General Conditions of Carriage</a>
      and <a href="#purchase">Purchase conditions</a>.
    </label>
    <button id="confirm" type="button">CONFIRM</button>
  </main>
</body>
</html>
